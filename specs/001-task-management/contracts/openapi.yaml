openapi: 3.1.0
info:
  title: Task Management API
  version: 1.0.0
  description: Team-scoped task and comment management. Identity, team membership, and administrator roles are supplied by the existing JWT identity system.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Report API and PostgreSQL readiness
      responses:
        '200': { description: Healthy }
        '503': { description: Dependency unavailable }
  /api/tasks:
    get:
      summary: List tasks visible to the authenticated member's team
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/assigneeId'
      responses:
        '200':
          description: Matching tasks; an empty collection is a valid result.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a task in Backlog
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/taskId'
    get:
      summary: Get one visible task and its comments
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
    patch:
      summary: Update title, description, due date, or assignee as creator or administrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTaskRequest' } } }
      responses:
        '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
    delete:
      summary: Permanently delete a task and all of its comments as creator or administrator
      responses:
        '204': { description: Permanently deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
  /api/tasks/{taskId}/status:
    parameters:
      - $ref: '#/components/parameters/taskId'
    patch:
      summary: Change status as creator, current assignee, or administrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStatusRequest' } } }
      responses:
        '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/taskId'
    post:
      summary: Add a comment as an authenticated member of the task's team
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCommentRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    taskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    status: { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
    assigneeId: { name: assigneeId, in: query, schema: { type: string, minLength: 1 } }
  responses:
    Unauthorized:
      description: Missing, expired, malformed, or invalid bearer token.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: AUTHENTICATION_REQUIRED, message: A valid bearer token is required, details: {} } } }
    Forbidden:
      description: Authenticated caller lacks task action permission or team membership.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: TASK_DELETE_FORBIDDEN, message: You do not have permission to delete this task, details: { taskId: 00000000-0000-0000-0000-000000000000 } } } }
    ValidationError:
      description: Invalid input.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: TASK_TITLE_REQUIRED, message: Title is required, details: { field: title } } } }
    TaskNotFound:
      description: No visible task exists for this identifier.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: TASK_NOT_FOUND, message: Task was not found, details: { taskId: 00000000-0000-0000-0000-000000000000 } } } }
    VersionConflict:
      description: The task changed after the caller read it; refresh and retry.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: TASK_VERSION_CONFLICT, message: Task changed before your update could be saved; refresh and retry, details: { taskId: 00000000-0000-0000-0000-000000000000 } } } }
  schemas:
    TaskStatus: { type: string, enum: [BACKLOG, IN_PROGRESS, IN_REVIEW, DONE] }
    CreateTaskRequest:
      type: object
      required: [title, assigneeId]
      properties:
        title: { type: string, minLength: 1, description: Leading/trailing whitespace is trimmed; whitespace-only is invalid. }
        description: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        assigneeId: { type: string, minLength: 1 }
    UpdateTaskRequest:
      type: object
      required: [title, assigneeId, version]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        assigneeId: { type: string, minLength: 1 }
        version: { type: integer, format: int64, minimum: 1 }
    UpdateStatusRequest:
      type: object
      required: [status, version]
      properties:
        status: { $ref: '#/components/schemas/TaskStatus' }
        version: { type: integer, format: int64, minimum: 1 }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, description: Leading/trailing whitespace is trimmed; whitespace-only is invalid. }
    Task:
      type: object
      required: [id, teamId, title, creatorId, assigneeId, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        creatorId: { type: string }
        assigneeId: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    Comment:
      type: object
      required: [id, taskId, authorId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        authorId: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [comments]
          properties: { comments: { type: array, items: { $ref: '#/components/schemas/Comment' } } }
    TaskList:
      type: object
      required: [items, filters]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        filters:
          type: object
          properties:
            status: { anyOf: [{ $ref: '#/components/schemas/TaskStatus' }, { type: 'null' }] }
            assigneeId: { type: [string, 'null'] }
    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string, description: Stable machine-readable error code. }
        message: { type: string, description: Safe human-readable explanation. }
        details: { type: object, additionalProperties: true, description: Request-relevant non-sensitive data. }
