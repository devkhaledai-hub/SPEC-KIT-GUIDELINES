services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_management}
      POSTGRES_USER: ${POSTGRES_USER:-task_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-untracked-env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TaskManagement: ${ConnectionStrings__TaskManagement:?set-in-untracked-env}
      Jwt__Authority: ${Jwt__Authority:?set-in-untracked-env}
      Jwt__Audience: ${Jwt__Audience:?set-in-untracked-env}
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
